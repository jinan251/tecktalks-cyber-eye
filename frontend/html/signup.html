<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CyberEye - Sign Up</title>
  <link rel="stylesheet" href="../css/style.css">
</head>

<body>

  <div class="container">

    <h1 class="logo">Cyber<span>Eye</span></h1>

    <p class="tagline">Create your secure account</p>

    <!-- Signup Form -->
    <form class="form">

      <input type="text" placeholder="Full Name" required>
      <input type="email" placeholder="Email" required>
      <input type="text" placeholder="Phone Number" required>
      <div class="password-wrapper">
  <input type="password" placeholder="Password" required>
    <div class="password-rules">
      <p id="rule-length">• At least 8 characters</p>
      <p id="rule-uppercase">• One uppercase letter</p>
      <p id="rule-number">• One number</p>
      <p id="rule-special">• One special character</p>
    </div>

  <span class="toggle-password">
    <svg class="eye-open" xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
      <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
      <circle cx="12" cy="12" r="3"/>
    </svg>

    <svg class="eye-closed" xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" style="display:none;">
      <path d="M17.94 17.94A10.94 10.94 0 0112 20C5 20 1 12 1 12a21.77 21.77 0 015.06-6.94"/>
      <path d="M1 1l22 22"/>
    </svg>
  </span>
</div>

      <div class="password-wrapper">
  <input type="password" placeholder="Confirm Password" required>

  <span class="toggle-password">
    <svg class="eye-open" xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
      <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
      <circle cx="12" cy="12" r="3"/>
    </svg>

    <svg class="eye-closed" xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" style="display:none;">
      <path d="M17.94 17.94A10.94 10.94 0 0112 20C5 20 1 12 1 12a21.77 21.77 0 015.06-6.94"/>
      <path d="M1 1l22 22"/>
    </svg>
  </span>
</div>

      <button type="submit" class="btn login">Sign Up</button>

    </form>

    <div id="verifyBox" style="display:none; margin-top:20px;">

  <h3>Enter Verification Code</h3>

  <input type="text" id="verificationCode" placeholder="Enter code">

  <button type="button" id="verifyBtn" class="btn login">
    Verify
  </button>

  <p id="verifyError" class="error-message"></p>

</div>

    <p id="errorMessage" class="error-message"></p>

    <p class="switch">
      Already have an account?
      <a href="login.html">Login</a>
    </p>

  </div>
  <script src="../javaScript/signup.js"></script>

</body>
</html>
